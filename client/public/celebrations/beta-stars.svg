<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 280 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Bookish Corner: achievement animation (vines, flowers and stars). Generated from the "Animaciones de logros" test page. -->
<style>
svg { overflow: visible; }
.vine { fill: none; stroke: #7F9070; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1;
  animation: draw var(--dur, 1.1s) cubic-bezier(.3, .1, .2, 1) var(--d, .15s) both; }
.leaf-shape { fill: #8E9E7E; transform-box: fill-box; transform-origin: 0% 50%;
  animation: sprout .38s cubic-bezier(.2, .8, .3, 1.2) var(--d) both; }
.flower { transform-box: fill-box; transform-origin: center;
  animation: bloom .5s cubic-bezier(.2, .8, .3, 1.2) var(--d) both; }
.petal { fill: #C496A1; }
.petal.blue { fill: #8EA8C8; }
.flower-core { fill: #D9B45F; }
.star-shape { fill: #D9B45F; transform-box: fill-box; transform-origin: center;
  animation: twinkle .55s cubic-bezier(.2, .8, .3, 1) var(--d) both; }
.star-shape.rose { fill: #B07E8A; }
.star-shape.blue { fill: #8EA8C8; }
.star-shape.loop { animation: twinkle .55s cubic-bezier(.2, .8, .3, 1) var(--d) both, shimmer 2.4s ease-in-out calc(var(--d) + .6s) infinite; }
.press { fill: none; stroke: #C496A1; stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center;
  animation: press-ring .7s ease-out var(--d, .5s) both; }
.burst { transform: translate(var(--dx), var(--dy)); animation: burst .7s cubic-bezier(.2, .8, .3, 1) var(--d) both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes sprout { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
@keyframes bloom { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes twinkle { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 55% { transform: scale(1.35) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes shimmer { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
@keyframes press-ring { from { transform: scale(.6); opacity: .55; } to { transform: scale(1.7); opacity: 0; } }
@keyframes burst { from { transform: translate(0, 0) scale(0); opacity: 0; } 60% { opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<circle cx="120" cy="120" r="52" class="press" style="--d: .55s;"></circle><g transform="translate(120 120)"><g class="burst" style="--dx: 0px; --dy: -98px; --d: 0.9s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.9)" style="--d: 0.9s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: 57.6px; --dy: -79.3px; --d: 0.9s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" transform="scale(0.7)" style="--d: 0.9s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: 93.2px; --dy: -30.3px; --d: 1s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.9)" style="--d: 1s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: 93.2px; --dy: 30.3px; --d: 1s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.7)" style="--d: 1s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: 57.6px; --dy: 79.3px; --d: 1.1s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" transform="scale(0.9)" style="--d: 1.1s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: 0px; --dy: 98px; --d: 1.1s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.7)" style="--d: 1.1s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: -57.6px; --dy: 79.3px; --d: 1.1s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.9)" style="--d: 1.1s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: -93.2px; --dy: 30.3px; --d: 1.2s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" transform="scale(0.7)" style="--d: 1.2s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: -93.2px; --dy: -30.3px; --d: 1.2s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.9)" style="--d: 1.2s;"></path></g></g><g transform="translate(120 120)"><g class="burst" style="--dx: -57.6px; --dy: -79.3px; --d: 1.3s;"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" transform="scale(0.7)" style="--d: 1.3s;"></path></g></g><g transform="translate(18 30) scale(1.1)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" style="--d: 1.6s;"></path></g><g transform="translate(222 26) scale(0.9)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" style="--d: 1.7s;"></path></g><g transform="translate(10 200) scale(0.8)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" style="--d: 1.8s;"></path></g><g transform="translate(232 212) scale(1)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" style="--d: 1.9s;"></path></g><g transform="translate(120 -6) scale(0.8)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" style="--d: 2s;"></path></g><g transform="translate(60 236) scale(0.7)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape rose loop" style="--d: 2s;"></path></g><g transform="translate(190 236) scale(0.8)"><path d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" class="star-shape loop" style="--d: 2.1s;"></path></g>
</svg>
