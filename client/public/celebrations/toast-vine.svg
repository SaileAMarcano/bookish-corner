<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Bookish Corner: achievement animation (vines, flowers and stars). Generated from the "Animaciones de logros" test page. -->
<style>
svg { overflow: visible; }
.vine { fill: none; stroke: #7F9070; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1;
  animation: draw var(--dur, 1.1s) cubic-bezier(.3, .1, .2, 1) var(--d, .15s) both; }
.leaf-shape { fill: #8E9E7E; transform-box: fill-box; transform-origin: 0% 50%;
  animation: sprout .38s cubic-bezier(.2, .8, .3, 1.2) var(--d) both; }
.flower { transform-box: fill-box; transform-origin: center;
  animation: bloom .5s cubic-bezier(.2, .8, .3, 1.2) var(--d) both; }
.petal { fill: #C496A1; }
.petal.blue { fill: #8EA8C8; }
.flower-core { fill: #D9B45F; }
.star-shape { fill: #D9B45F; transform-box: fill-box; transform-origin: center;
  animation: twinkle .55s cubic-bezier(.2, .8, .3, 1) var(--d) both; }
.star-shape.rose { fill: #B07E8A; }
.star-shape.blue { fill: #8EA8C8; }
.star-shape.loop { animation: twinkle .55s cubic-bezier(.2, .8, .3, 1) var(--d) both, shimmer 2.4s ease-in-out calc(var(--d) + .6s) infinite; }
.press { fill: none; stroke: #C496A1; stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center;
  animation: press-ring .7s ease-out var(--d, .5s) both; }
.burst { transform: translate(var(--dx), var(--dy)); animation: burst .7s cubic-bezier(.2, .8, .3, 1) var(--d) both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes sprout { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
@keyframes bloom { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes twinkle { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 55% { transform: scale(1.35) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes shimmer { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
@keyframes press-ring { from { transform: scale(.6); opacity: .55; } to { transform: scale(1.7); opacity: 0; } }
@keyframes burst { from { transform: translate(0, 0) scale(0); opacity: 0; } 60% { opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
